<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Mauro Martinez — AI automation, analytics and global trade</title>
  <desc id="desc">Globalaize. Go Global with AI. n8n, Python, Fabric, Power BI, SQL and Excel. International trade experience since 2018.</desc>
  <style>
