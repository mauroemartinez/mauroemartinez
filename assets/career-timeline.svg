<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" viewBox="0 0 1060 400" role="img" aria-labelledby="title desc">
  <title id="title">Mauro Martinez's career in international trade, analytics, and AI</title>
  <desc id="desc">2018: Worked as an Import Analyst while studying International Trade and began learning Chinese. 2022: Commercial Business Intelligence at B&amp;B Consultora. 2023: Founded GlobalAIze and delivered trade analytics for Proa Latam as a client. 2024: Graduated in International Trade and joined Launch Consulting as a remote Data Analyst supporting Microsoft. 2026: Joined SLS Global to lead AI and trade automation.</desc>
    <rect width="1060" height="400" rx="18" fill="#07172f"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="32" y="39" fill="#f0f6fc" font-size="21" font-weight="600">A career connecting global trade, analytics &amp; AI</text>
    <path d="M112 82H948" stroke="#20b0d0" stroke-width="3"/>
    <g fill="#20b0d0" stroke="#07172f" stroke-width="4"><circle cx="112" cy="82" r="8"/><circle cx="321" cy="82" r="8"/><circle cx="530" cy="82" r="8"/><circle cx="739" cy="82" r="8"/><circle cx="948" cy="82" r="8"/></g>
    <g fill="#59d6ef" font-size="22" font-weight="700" text-anchor="middle"><text x="112" y="119">2018</text><text x="321" y="119">2022</text><text x="530" y="119">2023</text><text x="739" y="119">2024—25</text><text x="948" y="119">2026—now</text></g>
    <g fill="#102a43" stroke="#24465d"><rect x="28" y="137" width="168" height="218" rx="12"/><rect x="237" y="137" width="168" height="218" rx="12"/><rect x="446" y="137" width="168" height="218" rx="12"/><rect x="655" y="137" width="168" height="218" rx="12"/><rect x="864" y="137" width="168" height="218" rx="12"/></g>
    <image x="501" y="140" width="58" height="58" href="data:image/jpeg;base64," aria-label="GlobalAIze logo" />
    <g fill="#f0f6fc" font-size="13" font-weight="700"><text x="44" y="166">COMEX + STUDIES</text><text x="253" y="166">COMMERCIAL BI</text><text x="671" y="158"><tspan x="671" dy="0">DEGREE +</tspan><tspan x="671" dy="16">MICROSOFT</tspan></text><text x="880" y="166">AI + COMEX</text></g>
    <g fill="#b8c9d9" font-size="13">
      <text x="44" y="195"><tspan x="44" dy="0">Import Analyst while</tspan><tspan x="44" dy="20">studying International</tspan><tspan x="44" dy="20">Trade at UNLaM.</tspan><tspan x="44" dy="26">Started learning</tspan><tspan x="44" dy="20">Chinese.</tspan></text>
      <text x="253" y="195"><tspan x="253" dy="0">B&amp;B Consultora</tspan><tspan x="253" dy="20">Turned trade data into</tspan><tspan x="253" dy="20">a client-facing BI</tspan><tspan x="253" dy="20">service and automated</tspan><tspan x="253" dy="20">reporting.</tspan></text>
      <text x="462" y="211"><tspan x="462" dy="0">Proa Latam | client</tspan><tspan x="462" dy="20">Trade analytics for</tspan><tspan x="462" dy="20">market expansion.</tspan><tspan x="462" dy="26">GlobalAIze founder</tspan><tspan x="462" dy="20">since 2023; building</tspan><tspan x="462" dy="20">data and AI solutions.</tspan></text>
      <text x="671" y="205"><tspan x="671" dy="0">Graduated in</tspan><tspan x="671" dy="19">International Trade.</tspan><tspan x="671" dy="24">Launch Consulting</tspan><tspan x="671" dy="19">Data Analyst for</tspan><tspan x="671" dy="19">Microsoft, working</tspan><tspan x="671" dy="19">fully in English.</tspan></text>
      <text x="880" y="195"><tspan x="880" dy="0">SLS Global</tspan><tspan x="880" dy="20">AI automation for</tspan><tspan x="880" dy="20">international trade.</tspan><tspan x="880" dy="26">Production workflows</tspan><tspan x="880" dy="20">with a RAG-powered</tspan><tspan x="880" dy="20">sourcing SaaS.</tspan></text>
    </g>
    <text x="32" y="380" fill="#59d6ef" font-size="13">GlobalAIze continues alongside my roles — building analytics and AI products for international business.</text>
  </g>
